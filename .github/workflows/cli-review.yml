name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr-diff.txt

      - name: Run Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          REVIEW=$(claude --print \
            -p "请 review 以下 PR diff:\n\n\`\`\`diff\n$(cat /tmp/pr-diff.txt)\n\`\`\`" \
            -f .claude/commands/review.zh-Hans.md 2>/dev/null || \
            claude --print \
            -p "请 review 以下 PR diff。PR标题: ${{ github.event.pull_request.title }}\n\n\`\`\`diff\n$(cat /tmp/pr-diff.txt | head -1000)\n\`\`\`" \
            -f .claude/commands/review.zh-Hans.md)
          echo "REVIEW_BODY<<EOF" >> $GITHUB_ENV
          echo "$REVIEW" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.REVIEW_BODY || "AI review 执行失败，请检查 workflow 日志。";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${body}`
            });
