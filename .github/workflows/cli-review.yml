name: Claude Auto Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr-diff.txt

      - name: Run AI Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          cat > /tmp/prompt.txt << 'PROMPT_EOF'
          请 review 以下 PR diff。

          PR 标题：${{ github.event.pull_request.title }}
          仓库：${{ github.repository }}

          ```diff
          PROMPT_EOF
          cat /tmp/pr-diff.txt >> /tmp/prompt.txt
          cat >> /tmp/prompt.txt << 'PROMPT_EOF'
          ```

          请按 .claude/commands/review.zh-Hans.md 的标准进行 review。
          PROMPT_EOF

          claude --print -p "$(cat /tmp/prompt.txt)" > /tmp/review-output.txt 2>&1

      - name: Post Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW=$(cat /tmp/review-output.txt)
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🤖 AI Code Review

          $REVIEW"